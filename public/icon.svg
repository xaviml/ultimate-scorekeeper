<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app's own ground behind the mark, so the icon looks like the app it opens. -->
  <rect width="100" height="100" rx="22" fill="#ECEFF4"/>
  <!-- Two half-discs, one per team, with a real gap between them. The left is solid
       navy with its pips punched through (fill-rule evenodd) so the ground shows; the
       right is its negative: the ground framed by a thin navy line, its pips solid. -->
  <path fill="#1F3A6B" fill-rule="evenodd" d="M48.4,20.04 A30,30 0 0,0 48.4,79.96 Z
    M33.6,40 a3.4,3.4 0 1,0 6.8,0 a3.4,3.4 0 1,0 -6.8,0 Z
    M33.6,50 a3.4,3.4 0 1,0 6.8,0 a3.4,3.4 0 1,0 -6.8,0 Z
    M33.6,60 a3.4,3.4 0 1,0 6.8,0 a3.4,3.4 0 1,0 -6.8,0 Z"/>
  <!-- Drawn one stroke-half inside the radius, so its outer edge meets the left half's. -->
  <path fill="none" stroke="#1F3A6B" stroke-width="2" stroke-linejoin="miter"
    d="M52.6,21.12 A29,29 0 0,1 52.6,78.88 Z"/>
  <circle cx="63" cy="45" r="3.4" fill="#1F3A6B"/>
  <circle cx="63" cy="55" r="3.4" fill="#1F3A6B"/>
</svg>
